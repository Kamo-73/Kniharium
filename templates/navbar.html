{% load static %}
<!-- Horný navigačný pás -->
<div class="bg-white py-2">
    <div class="container d-flex justify-content-center" style="font-size: 20px; gap: 60px;">
        <a class="text-dark text-decoration-none" href="{% url 'books' %}">Knihy</a>
        <a class="text-dark text-decoration-none" href="{% url 'authors' %}">Autoři</a>
        <a class="text-dark text-decoration-none" href="{% url 'publishers' %}">Nakladatelství</a>
        <a class="text-dark text-decoration-none" href="{% url 'login' %}">Přihlášení</a>
        <a class="text-dark text-decoration-none" href="{% url 'about' %}">O nás</a>
    </div>
</div>




<!-- Stredný pás: logo + info -->
<div class="bg-white py-3">
    <div class="container d-flex justify-content-between align-items-center">

        <!-- Ľavá časť -->
        <div class="text-start">
            {% if user.is_authenticated %}
                Jsi přihlášen jako <strong>{{ user.username }}</strong><br>
                <a href="{% url 'profile' user.id %}">Profil</a><br>
                <a href="{% url 'logout' %}">Odhlásit</a>
            {% else %}
                Nepřihlášený uživatel
            {% endif %}
        </div>

        <!-- Stredná časť (logo + názov) -->
        <div class="text-center">
            <a href="{% url 'home' %}">
                <img src="{% static 'images/Logo.png' %}" alt="Logo" style="height: 150px;">
            </a>
        </div>

        <!-- Pravá časť -->
        <div class="text-end">
            Dnes je 2.4.2025<br>
            Meniny má Milan
        </div>

    </div>
</div>

<!-- Spodný pás: vyhľadávací panel -->
<div class="bg-white py-3">
    <div class="container d-flex justify-content-center align-items-center flex-wrap gap-2">

        <div class="input-group w-50">
            <input type="text" class="form-control" placeholder="Vyhľadať">
        </div>

        <button class="btn btn-outline-secondary mx-2">Vyhľadať</button>
        <button class="btn btn-outline-secondary">Náhodná kniha</button>

    </div>
</div>
